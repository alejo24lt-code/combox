<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combox | Sign Up</title>
    <link rel="icon" type="image/png" href="icons/logo.png">



    <style>
    .error-message {
        color: red;
        font-size: 13px;
        display: block;
        margin-top: 4px;
    }
</style>


</head>

<body style="
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0C6E0C, #1565C0);
">

    <div style="
        width: 340px;
        margin: 50px auto;
        padding: 30px;
        background-color: rgba(245,245,245,0.95);
        border: 3px solid #0C6E0C;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    ">

        <img src="icons/logo.png" alt="Combox Logo" width="90">

        <h2 style="color: #0C6E0C;">
            Create your Combox account
        </h2>

        <p style="color: #555555;">
            Register a new account.
        </p>


        <!-- Esta linea es la mas importante porque es la que conecta al php y manda hacer el registro  este tiene nombre del formulario, el action
         que es a donde se envia la informacion y el metodo POST que es como se evia la informacion-->
        <form name="signupForm" action="signup.php" method="POST">



        <label for="firstname" style="color: #1565C0;">
            First name:
        </label><br>

        <!--el id sirve para identificar el elemento en html mientras que name es el mas importante porque es el que se utiliza para enviar los datos al servidor-->

        <input type="text" id="firstname" name="firstname" required style="
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            border: 2px solid #1565C0;
            border-radius: 6px;
        ">

        <br><br>

        <label for="lastname" style="color: #1565C0;">
            Last name:
        </label><br>

        <input type="text" id="lastname" name="lastname" required style="
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            border: 2px solid #1565C0;
            border-radius: 6px;
        ">
        <br><br>

        <label for="phone" style="color: #1565C0;">
            Mobile number:
        </label><br>

        <input type="tel" id="phone" name="phone" required style="
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            border: 2px solid #1565C0;
            border-radius: 6px;
        ">
        <span id="phone-error" class="error-message"></span>
        <br><br>

        <label for="email" style="color: #1565C0;">
            Email:
        </label><br>

        <input type="email" id="email" name="email" required style=" 
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            border: 2px solid #1565C0;
            border-radius: 6px;
        ">
        <span id="email-error" class="error-message"></span>
        <br><br>

        <label for="password" style="color: #1565C0;">
            Password:
        </label><br>

        <input type="password" id="password" name="password" style="
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            border: 2px solid #1565C0;
            border-radius: 6px;
        ">
        <br><br>

        <button type="submit" style="
            background-color: #0C6E0C;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 6px;
            cursor: pointer;
        ">
            Register
        </button>
            </form>

        <p>
            <a href="signin.html" style="
                color: #1565C0;
                text-decoration: none;
            ">
                Already have an account? Sign In
            </a>
        </p> </div>



        <script>
    const form = document.querySelector('form');

    form.addEventListener('submit', async function(event) {

        event.preventDefault();

        document.getElementById('phone-error').textContent = '';
        document.getElementById('email-error').textContent = '';

        const formData = new FormData(form);

        try {

            const response = await fetch('signup.php', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (!result.success) {

                if (result.field === 'phone') {
                    document.getElementById('phone-error').textContent = result.message;
                }

                if (result.field === 'email') {
                    document.getElementById('email-error').textContent = result.message;
                }

            } else {

                alert(result.message);
                window.location.href = 'signin.html';

            }

        } catch (error) {

    alert('Error: ' + error.message);
    console.error(error);

}

    });
</script>



</body>
</html>
