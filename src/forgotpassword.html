<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combox | Forgot Password</title>
    <link rel="icon" type="image/png" href="icons/logo.png">
</head>

<body style="
    background: linear-gradient(135deg, #0C6E0C, #1565C0);
    font-family: Arial, sans-serif;
">

    <div style="
        width: 350px;
        margin: 80px auto;
        padding: 35px;
        border: 3px solid #1565C0;
        border-radius: 15px;
        background-color: #FFFFFF;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    ">

        <img src="icons/logo.png" alt="Combox Logo" width="90">

        <h2 style="color: #1565C0;">
            Forgot Password?
        </h2>

        <p style="color: #555555;">
            Don't worry! Enter your email and we'll help you reset your password.
        </p>

        <label for="email" style="
            color: #0C6E0C;
            font-weight: bold;
        ">
            Email:
        </label><br>

        <input type="email" id="email" name="email" 
        placeholder="Enter your email"
        style="
            width: 90%;
            padding: 10px;
            margin-top: 8px;
            border: 2px solid #1565C0;
            border-radius: 6px;
            outline: none;
        ">

        <br><br>

        <button type="submit" style="
            background-color: #1565C0;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        ">
            Reset Password
        </button>

        <p style="margin-top: 22px;">
            <a href="signin.html" style="
                color: #0C6E0C;
                text-decoration: none;
            ">
                ← Back to Sign In
            </a>
        </p>

    </div>

</body>
</html>
