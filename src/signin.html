
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Combox | Sign In</title>

<link rel="icon" type="image/png" href="icons/logo.png">

<style>

    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #0C6E0C, #1565C0);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 360px;
        background-color: rgba(245, 245, 245, 0.95);
        padding: 35px;
        text-align: center;
        border: 3px solid #1565C0;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .logo {
        width: 90px;
        height: 90px;
        margin-bottom: 15px;
    }

    h2 {
        color: #1565C0;
        margin-bottom: 10px;
    }

    .welcome {
        color: #555;
        margin-bottom: 25px;
    }

    label {
        color: #0C6E0C;
        font-weight: bold;
    }

    input {
        width: 90%;
        padding: 9px;
        margin-top: 6px;
        border: 2px solid #1565C0;
        border-radius: 6px;
        outline: none;
    }

    input:focus {
        border-color: #0C6E0C;
    }

    .signin {
        background-color: #1565C0;
        color: white;
        border: none;
        padding: 10px 30px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
    }

    .signin:hover {
        background-color: #0D47A1;
    }

    .link {
        text-decoration: none;
        font-size: 14px;
    }

    .forgot {
        color: #1565C0;
    }

    .signup {
        color: #0C6E0C;
    }

</style>

</head>

<body>

<div class="container">

    <img src="icons/logo.png" alt="Combox Logo" class="logo">

    <h2>Sign in to Combox</h2>

    <p class="welcome">
        Welcome back!
    </p>

    <label for="email">
        Email:
    </label>

    <br>

    <input 
        type="email" 
        id="email" 
        name="email"
        placeholder="Enter your email"
    >

    <br><br>

    <label for="password">
        Password:
    </label>

    <br>

    <input 
        type="password" 
        id="password" 
        name="password"
        placeholder="Enter your password"
    >

    <br><br>

    <button type="submit" class="signin">
        Sign In
    </button>

    <p>
        <a href="forgotpassword.html" class="link forgot">
            Forgot Password?
        </a>
    </p>

    <p>
        <a href="signup.html" class="link signup">
            Create an account
        </a>
    </p>

</div>

</body>

</html>
