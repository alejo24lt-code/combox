
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COMBOX - HOME</title>

<link rel="icon" type="image/png" href="src/icons/logo.png">

<style>

    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #0C6E0C, #1565C0);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 400px;
        background-color: rgba(245, 245, 245, 0.95);
        padding: 40px;
        text-align: center;
        border-radius: 15px;
        border: 3px solid #1565C0;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .logo {
        width: 90px;
        height: 90px;
        margin-bottom: 15px;
    }

    h1 {
        margin: 0;
        color: #1565C0;
        font-size: 32px;
    }

    .subtitle {
        color: #555;
        margin: 10px 0 30px;
        font-size: 16px;
    }

    .buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .btn {
        display: block;
        padding: 13px;
        border-radius: 7px;
        text-decoration: none;
        font-weight: bold;
        font-size: 16px;
    }

    .signin {
        background-color: #1565C0;
        color: white;
    }

    .signin:hover {
        background-color: #0D47A1;
    }

    .signup {
        background-color: #0C6E0C;
        color: white;
    }

    .signup:hover {
        background-color: #095509;
    }

    .footer {
        margin-top: 25px;
        font-size: 13px;
        color: #777;
    }

</style>

</head>

<body>

<div class="container">

    <img src="src/icons/logo.png" alt="COMBOX Logo" class="logo">

    <h1>Welcome to COMBOX</h1>

    <p class="subtitle">
        Your platform for connecting and managing your services.
    </p>

    <div class="buttons">

        <a href="src/signin.html" class="btn signin">
            Sign in
        </a>

        <a href="src/signup.html" class="btn signup">
            Sign up
        </a>

    </div>

    <p class="footer">
        Please select an option to continue
    </p>

</div>

</body>

</html>
